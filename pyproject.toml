[tool.poetry]
name = "tracker-task"
version = "1.0.0"
description = "Employee Task Management API — FastAPI service for assigning and tracking work."
authors = ["Ilya Kovalchuk <mrlivedance@vk.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.2"
fastapi-users = { extras = ["sqlalchemy"], version = "^13.0.0" }
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = { extras = ["email"], version = "^2.7.1" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.29" }
pydantic-settings = "^2.2.1"
uvicorn = { extras = ["standard"], version = "^0.30.5" }
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
